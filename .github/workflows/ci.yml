name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Type-check, test, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm type-check
      - run: pnpm test
      - run: pnpm build

  # @setup-template-only
  setup-matrix:
    name: Every setup combination
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm setup:verify --concurrency 2

  create-fastra:
    name: pnpm create fastra (packed package)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build and pack like npm publish
        run: |
          pnpm build:create
          cd packages/create-fastra && npm pack --pack-destination "$RUNNER_TEMP"
      - name: Create a project from this commit
        run: |
          git config --global user.email ci@example.com && git config --global user.name CI
          cd "$RUNNER_TEMP"
          pnpm dlx "file:$RUNNER_TEMP/create-fastra-$(node -p "require('$GITHUB_WORKSPACE/packages/create-fastra/package.json').version").tgz" \
            shop-api --template "$GITHUB_WORKSPACE" \
            --auth better-auth --orm drizzle --storage local --redis none --deploy none --yes
      - name: Check the generated project
        working-directory: ${{ runner.temp }}/shop-api
        run: |
          test "$(node -p "require('./package.json').name")" = "shop-api"
          test ! -e setup && test ! -e packages
          test -z "$(git status --porcelain)"
          # Drizzle project: the Prisma peer of drizzle-orm must not stay in the lockfile
          ! grep -q '@prisma/client@' pnpm-lock.yaml || exit 1
          pnpm check && pnpm type-check && pnpm test

  monorepo:
    name: pnpm create fastra in a Turborepo
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: app
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d app"
          --health-interval 5s --health-timeout 5s --health-retries 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - { pnpm: 10.28.2, auth: better-auth, orm: drizzle, storage: local }
          # pnpm 11 fails installs on unapproved install scripts; Prisma needs its engines built
          - { pnpm: 11.25.0, auth: better-auth, orm: prisma, storage: local }
          # drizzle-orm pulls prisma in as a peer; its install scripts must be listed as skipped
          - { pnpm: 11.25.0, auth: better-auth, orm: drizzle, storage: local }
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build and pack like npm publish
        run: |
          pnpm build:create
          cd packages/create-fastra && npm pack --pack-destination "$RUNNER_TEMP"
      - name: Create a Turborepo
        working-directory: ${{ runner.temp }}
        run: |
          git config --global user.email ci@example.com && git config --global user.name CI
          mkdir -p mono/apps/web && cd mono
          cat > package.json <<JSON
          {"name": "mono", "private": true, "packageManager": "pnpm@${{ matrix.pnpm }}", "devDependencies": {"turbo": "2.10.13"}}
          JSON
          printf 'packages:\n  - "apps/*"\n  - "packages/*"\n' > pnpm-workspace.yaml
          cat > turbo.json <<JSON
          {"\$schema": "https://turborepo.dev/schema.json", "tasks": {"build": {"dependsOn": ["^build"]}, "lint": {}, "check-types": {}, "test": {}}}
          JSON
          echo '{"name": "web", "private": true, "scripts": {"build": "echo web"}}' > apps/web/package.json
          printf 'node_modules\n.turbo\n' > .gitignore
          pnpm install
          git init --quiet && git add -A && git commit --quiet -m init
      - name: Create the API inside it
        working-directory: ${{ runner.temp }}/mono
        run: |
          pnpm dlx "file:$RUNNER_TEMP/create-fastra-$(node -p "require('$GITHUB_WORKSPACE/packages/create-fastra/package.json').version").tgz" \
            apps/api --template "$GITHUB_WORKSPACE" \
            --auth ${{ matrix.auth }} --orm ${{ matrix.orm }} --storage ${{ matrix.storage }} --redis none --deploy none --yes
      - name: Check the workspace
        working-directory: ${{ runner.temp }}/mono
        run: |
          cat pnpm-workspace.yaml
          test "$(pnpm --version)" = "${{ matrix.pnpm }}"
          # The workspace root owns the lockfile, settings, and git repository
          for file in pnpm-lock.yaml pnpm-workspace.yaml .git .github setup packages; do test ! -e "apps/api/$file"; done
          test "$(node -p "require('./apps/api/package.json').packageManager ?? 'none'")" = "none"
          test -f apps/api/turbo.json
          grep -q '^  esbuild: false' pnpm-workspace.yaml
          ! grep -q 'set this to' pnpm-workspace.yaml || exit 1
          ! grep -q 'firebase' pnpm-workspace.yaml || exit 1
          if [ "${{ matrix.orm }}" = prisma ]; then grep -q '^  prisma: true' pnpm-workspace.yaml; else grep -q '^  prisma: false' pnpm-workspace.yaml; ! grep -q '@prisma/client@' pnpm-lock.yaml || exit 1; fi
          pnpm install --frozen-lockfile
      - name: Run Turborepo tasks for the API
        working-directory: ${{ runner.temp }}/mono
        run: |
          pnpm turbo run build lint check-types test --filter=api
          (cd apps/api && pnpm check)
          rm -rf apps/api/dist
          pnpm turbo run build --filter=api | tee turbo-build.log
          grep -q "cache hit" turbo-build.log
          test -f apps/api/dist/index.js
      - name: Build the Docker image from the workspace root
        working-directory: ${{ runner.temp }}/mono
        run: |
          test -f apps/api/Dockerfile.dockerignore
          for file in .dockerignore Dockerfile.monorepo; do test ! -e "apps/api/$file"; done
          docker build -f apps/api/Dockerfile -t mono-api .
      - name: Migrate, start, and stop the container
        working-directory: ${{ runner.temp }}/mono
        run: |
          {
            echo "DATABASE_URL=postgresql://postgres:postgres@localhost:5432/app"
            echo "BETTER_AUTH_URL=http://localhost:3000"
            echo "BETTER_AUTH_SECRET=$(openssl rand -base64 32)"
          } > ci.env
          if [ "${{ matrix.orm }}" = prisma ]; then
            docker run --rm --network host --env-file ci.env mono-api node_modules/.bin/prisma migrate deploy
          else
            docker run --rm --network host --env-file ci.env mono-api node dist/db/drizzle/migrate.js
          fi
          docker run -d --name mono-api --network host --env-file ci.env mono-api
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:3000/api/health/ready; then break; fi
            sleep 1
          done
          curl -fsS http://localhost:3000/api/health/ready
          docker stop --timeout 20 mono-api
          test "$(docker inspect mono-api --format '{{.State.ExitCode}}')" = "0" || { docker logs mono-api; exit 1; }

  latest-dependencies:
    name: Latest dependencies (no lockfile)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      # A monorepo ignores the template's lockfile, so check the newest versions the ranges allow
      - run: rm pnpm-lock.yaml && pnpm install --no-frozen-lockfile
      - run: pnpm type-check
      - run: pnpm test
      - run: pnpm build
  # @setup-endif

  docker:
    name: Docker image smoke test
    runs-on: ubuntu-latest
    # @setup-template-only
    strategy:
      fail-fast: false
      matrix:
        include:
          - { auth: better-auth, orm: drizzle, storage: local, redis: none }
          - { auth: better-auth, orm: prisma, storage: local, redis: redis }
          # File storage needs auth, so the API-only project has none
          - { auth: none, orm: none, storage: none, redis: none }
    # @setup-endif
    # @setup-if orm!=none|redis=redis
    services:
      # @setup-if orm!=none
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: app
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d app"
          --health-interval 5s --health-timeout 5s --health-retries 10
      # @setup-endif
      # @setup-if redis=redis
      redis:
        image: redis:8-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 10
      # @setup-endif
    # @setup-endif
    # @setup-if orm!=none
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/app
    # @setup-endif
    steps:
      - uses: actions/checkout@v7
      # @setup-template-only
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Configure a project from the template
        run: |
          git config user.email ci@example.com && git config user.name CI
          pnpm setup:project --auth ${{ matrix.auth }} --orm ${{ matrix.orm }} --storage ${{ matrix.storage }} --redis ${{ matrix.redis }} --deploy none --yes --force
      # @setup-endif
      - name: Build image
        run: docker build -t api .
      # @setup-if orm=drizzle
      - name: Image has no Prisma (an optional peer of drizzle-orm)
        # @setup-template-only
        if: matrix.orm == 'drizzle'
        # @setup-endif
        run: docker run --rm api sh -c '! ls node_modules/.pnpm | grep -q "^prisma@"'
      # @setup-endif
      - name: Write runtime env
        run: |
          {
            # @setup-if orm!=none
            echo "DATABASE_URL=$DATABASE_URL"
            # @setup-endif
            echo "LOG_LEVEL=info"
            # Placeholder provider config: enough to boot, no external calls at startup
            # @setup-if auth=better-auth
            echo "BETTER_AUTH_URL=http://localhost:3000"
            echo "BETTER_AUTH_SECRET=$(openssl rand -base64 32)"
            # @setup-endif
            # @setup-if auth=supabase
            echo "SUPABASE_URL=https://example.supabase.co"
            echo "SUPABASE_ANON_KEY=ci-placeholder"
            # @setup-endif
            # @setup-if auth=firebase
            echo "FIREBASE_PROJECT_ID=ci-placeholder"
            # @setup-endif
            # @setup-if auth=logto
            echo "LOGTO_ENDPOINT=https://example.logto.app"
            echo "LOGTO_API_RESOURCE=https://api.example.com"
            # @setup-endif
            # @setup-if redis=redis
            echo "REDIS_URL=redis://localhost:6379"
            # @setup-endif
            # @setup-if storage=s3
            echo "S3_BUCKET=ci-placeholder"
            echo "S3_REGION=us-east-1"
            # @setup-endif
          } > ci.env
      # @setup-if orm!=none
      - name: Run migrations in the image
        # @setup-template-only
        if: matrix.orm != 'none'
        # @setup-endif
        run: docker run --rm --network host --env-file ci.env api pnpm db:migrate:deploy
      # @setup-endif
      - name: Start container and check readiness
        run: |
          docker run -d --name api --network host --env-file ci.env api
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:3000/api/health/ready; then break; fi
            sleep 1
          done
          curl -fsS http://localhost:3000/api/health/ready
      # @setup-if auth=better-auth
      - name: Exercise the API
        # @setup-template-only
        if: matrix.auth == 'better-auth'
        # @setup-endif
        run: |
          curl -fsS -D headers.txt -o /dev/null -H 'content-type: application/json' \
            -d '{"email":"ci@example.com","password":"correct-horse-battery","name":"CI"}' \
            http://localhost:3000/api/auth/sign-up/email
          TOKEN=$(grep -i '^set-auth-token:' headers.txt | awk '{print $2}' | tr -d '\r')
          curl -fsS -H "authorization: Bearer $TOKEN" http://localhost:3000/api/me
          curl -fsS -H "authorization: Bearer $TOKEN" -H 'content-type: application/json' \
            -d '{"title":"from CI"}' http://localhost:3000/api/todos
          curl -fsS -H "authorization: Bearer $TOKEN" http://localhost:3000/api/todos | grep -q "from CI"
      # @setup-endif
      - name: Graceful shutdown exits 0
        run: |
          docker stop --timeout 20 api
          test "$(docker inspect api --format '{{.State.ExitCode}}')" = "0"
      - name: Container logs
        if: always()
        run: docker logs api || true
